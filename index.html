<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Planificación Financiera</title>

<style>
body{
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 20px;
}
h1{
    text-align:center;
}
.container{
    max-width: 900px;
    margin: auto;
}
.card{
    background:#1e293b;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
}
input{
    width:80px;
    padding:5px;
    border-radius:5px;
    border:none;
}
button{
    padding:6px 10px;
    border:none;
    border-radius:5px;
    background:#22c55e;
    color:white;
    cursor:pointer;
}
.done{
    text-decoration: line-through;
    opacity:0.6;
}
.total{
    font-size:20px;
    color:#22c55e;
}
</style>
</head>

<body>

<h1>💰 Mi Planificación</h1>

<div class="container">

<div class="card">
<h2>Día 15</h2>

<div>
<input value="3400" id="c1"> Charly 
<button onclick="toggle(this)">✔</button>
</div>

<div>
<input value="1750" id="c2"> Impuesto 
<button onclick="toggle(this)">✔</button>
</div>

<div>
<input value="2100" id="c3"> UNI 
<button onclick="toggle(this)">✔</button>
</div>

<div>
<input value="2400" id="c4"> Credima 
<button onclick="toggle(this)">✔</button>
</div>

<br>
<button onclick="calcular()">Calcular</button>
<p class="total" id="total15"></p>

</div>

<div class="card">
<h2>Día 30</h2>

<div>
<input value="3400" id="c5"> Charly 
<button onclick="toggle(this)">✔</button>
</div>

<div>
<input value="1750" id="c6"> Impuesto 
<button onclick="toggle(this)">✔</button>
</div>

<div>
<input value="3500" id="c7"> Banco 
<button onclick="toggle(this)">✔</button>
</div>

<div>
<input value="4000" id="c8"> Tarjeta 
<button onclick="toggle(this)">✔</button>
</div>

<br>
<button onclick="calcular()">Calcular</button>
<p class="total" id="total30"></p>

</div>

<div class="card">
<h2>💎 Ahorro</h2>
<input id="ahorro15" value="8000"> Día 15<br><br>
<input id="ahorro30" value="6000"> Día 30<br><br>

<button onclick="ahorro()">Calcular Ahorro</button>
<p class="total" id="totalAhorro"></p>
</div>

</div>

<script>
function toggle(btn){
    let div = btn.parentElement;
    div.classList.toggle("done");
}

function calcular(){
    let ingreso = 15000;

    let total15 = ingreso -
    c1.value - c2.value - c3.value - c4.value;

    let total30 = ingreso -
    c5.value - c6.value - c7.value - c8.value;

    document.getElementById("total15").innerText =
    "Disponible: " + total15;

    document.getElementById("total30").innerText =
    "Disponible: " + total30;
}

function ahorro(){
    let total =
    parseInt(ahorro15.value) +
    parseInt(ahorro30.value);

    document.getElementById("totalAhorro").innerText =
    "Ahorro mensual: " + total;
}
</script>

</body>
</html>
