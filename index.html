<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Cierre de Turno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .report-font { font-family: 'Roboto Mono', monospace; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <!-- Header / Editor (No se imprime en la imagen) -->
    <div class="no-print max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h1 class="text-2xl font-800 text-slate-800 mb-6 flex items-center gap-2">
                <span class="bg-blue-600 w-2 h-8 rounded-full"></span>
                Panel de Control del Informe
            </h1>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <!-- Fecha -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha</label>
                    <input type="date" id="input-fecha" class="w-full bg-slate-50 border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>

                <!-- Selección de Tanda -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tanda / Turno</label>
                    <select id="input-tanda" class="w-full bg-slate-50 border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <optgroup label="Tanda A">
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="A3">A3</option>
                        </optgroup>
                        <optgroup label="Tanda B">
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="B3">B3</option>
                        </optgroup>
                        <optgroup label="Tanda C">
                            <option value="C1" selected>C1</option>
                            <option value="C2">C2</option>
                            <option value="C3">C3</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Inspector -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Inspector de Calidad</label>
                    <input type="text" id="input-inspector" placeholder="Nombre completo" class="w-full bg-slate-50 border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <hr class="my-6 border-slate-100">

            <!-- Líneas de Producción -->
            <div class="space-y-6">
                <!-- PAVAN 2400 y 1700 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="p-4 bg-blue-50/50 rounded-xl border border-blue-100">
                        <label class="block text-sm font-bold text-blue-800 mb-2">PAVAN 2400</label>
                        <select id="prod-2400" onchange="toggleCustom('2400')" class="w-full mb-2 p-2 rounded border">
                            <option value="ESPAGUETI">ESPAGUETI</option>
                            <option value="LINGUINI">LINGUINI</option>
                            <option value="OTRO">OTRO (Escribir abajo)</option>
                        </select>
                        <input type="text" id="custom-2400" placeholder="Especifique otro producto" class="hidden w-full mb-2 p-2 rounded border text-sm">
                        <textarea id="desc-2400" placeholder="Descripción de la línea..." class="w-full p-2 text-sm rounded border h-20"></textarea>
                    </div>

                    <div class="p-4 bg-blue-50/50 rounded-xl border border-blue-100">
                        <label class="block text-sm font-bold text-blue-800 mb-2">PAVAN 1700</label>
                        <select id="prod-1700" onchange="toggleCustom('1700')" class="w-full mb-2 p-2 rounded border">
                            <option value="ESPAGUETI">ESPAGUETI</option>
                            <option value="LINGUINI">LINGUINI</option>
                            <option value="OTRO">OTRO (Escribir abajo)</option>
                        </select>
                        <input type="text" id="custom-1700" placeholder="Especifique otro producto" class="hidden w-full mb-2 p-2 rounded border text-sm">
                        <textarea id="desc-1700" placeholder="Descripción de la línea..." class="w-full p-2 text-sm rounded border h-20"></textarea>
                    </div>
                </div>

                <!-- Líneas con opción Descargada -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <label class="block text-sm font-bold text-slate-700 mb-2">PAVAN 1000</label>
                        <button onclick="setDescargada('1000')" class="w-full py-1 px-2 text-xs bg-slate-200 hover:bg-slate-300 rounded mb-2 transition">Marcar: Línea Descargada</button>
                        <textarea id="desc-1000" class="w-full p-2 text-xs rounded border h-16"></textarea>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <label class="block text-sm font-bold text-slate-700 mb-2">FIDEO NUEVA</label>
                        <button onclick="setDescargada('nueva')" class="w-full py-1 px-2 text-xs bg-slate-200 hover:bg-slate-300 rounded mb-2 transition">Marcar: Línea Descargada</button>
                        <textarea id="desc-nueva" class="w-full p-2 text-xs rounded border h-16"></textarea>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <label class="block text-sm font-bold text-slate-700 mb-2">FIDEO MADRIGAL</label>
                        <button onclick="setDescargada('madrigal')" class="w-full py-1 px-2 text-xs bg-slate-200 hover:bg-slate-300 rounded mb-2 transition">Marcar: Línea Descargada</button>
                        <textarea id="desc-madrigal" class="w-full p-2 text-xs rounded border h-16"></textarea>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex gap-4">
                <button onclick="generateReport()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                    Actualizar Reporte
                </button>
                <button onclick="downloadReport()" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 transition shadow-lg shadow-green-200 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Descargar como Imagen
                </button>
            </div>
        </div>
    </div>

    <!-- DOCUMENTO FINAL (Lo que se captura) -->
    <div id="capture-area" class="bg-white mx-auto p-10 max-w-[700px] border border-slate-300 report-font text-slate-900 leading-relaxed">
        <div class="text-center mb-8 border-b-2 border-slate-900 pb-4">
            <h2 class="text-2xl font-bold">INFORME DE CIERRE DE TURNO</h2>
        </div>

        <div class="space-y-2 text-lg mb-8">
            <p><span class="font-bold">FECHA:</span> <span id="out-fecha">--/--/----</span></p>
            <p><span class="font-bold">TANDA:</span> <span id="out-tanda">--</span></p>
            <p><span class="font-bold">INSPECTOR DE CALIDAD:</span> <span id="out-inspector" class="uppercase">--</span></p>
        </div>

        <div class="border-t border-slate-900 pt-6 space-y-8">
            <!-- Bloque Línea -->
            <div>
                <p class="font-bold text-lg mb-1">PAVAN 2400 [<span id="out-prod-2400"></span>]</p>
                <p id="out-desc-2400" class="whitespace-pre-wrap pl-4 border-l-2 border-slate-200 italic"></p>
            </div>

            <div>
                <p class="font-bold text-lg mb-1">PAVAN 1700 [<span id="out-prod-1700"></span>]</p>
                <p id="out-desc-1700" class="whitespace-pre-wrap pl-4 border-l-2 border-slate-200 italic"></p>
            </div>

            <div class="grid grid-cols-1 gap-6">
                <div>
                    <p class="font-bold text-lg mb-1">PAVAN 1000 [N/A]</p>
                    <p id="out-desc-1000" class="whitespace-pre-wrap pl-4 border-l-2 border-slate-200"></p>
                </div>
                <div>
                    <p class="font-bold text-lg mb-1">FIDEO NUEVA [N/A]</p>
                    <p id="out-desc-nueva" class="whitespace-pre-wrap pl-4 border-l-2 border-slate-200"></p>
                </div>
                <div>
                    <p class="font-bold text-lg mb-1">FIDEO MADRIGAL [N/A]</p>
                    <p id="out-desc-madrigal" class="whitespace-pre-wrap pl-4 border-l-2 border-slate-200"></p>
                </div>
            </div>
        </div>

        <div class="mt-20 flex justify-between">
            <div class="w-48 border-t border-slate-900 text-center pt-2 text-xs font-bold">FIRMA INSPECTOR</div>
            <div class="w-48 border-t border-slate-900 text-center pt-2 text-xs font-bold">RECIBIDO SUPERVISOR</div>
        </div>
        
        <div class="mt-8 text-[10px] text-slate-400 text-right uppercase">
            Sistema de Reportes - Generado el <span id="current-gen-time"></span>
        </div>
    </div>

    <script>
        // Establecer fecha de hoy al iniciar
        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('input-fecha').value = today;
            generateReport();
        };

        function toggleCustom(id) {
            const val = document.getElementById('prod-' + id).value;
            const customInput = document.getElementById('custom-' + id);
            if (val === 'OTRO') {
                customInput.classList.remove('hidden');
            } else {
                customInput.classList.add('hidden');
            }
        }

        function setDescargada(id) {
            document.getElementById('desc-' + id).value = "La línea descargada.";
        }

        function generateReport() {
            // Fecha y Tanda
            const fechaVal = document.getElementById('input-fecha').value;
            const [y, m, d] = fechaVal.split('-');
            document.getElementById('out-fecha').innerText = `${d}/${m}/${y}`;
            document.getElementById('out-tanda').innerText = document.getElementById('input-tanda').value;
            document.getElementById('out-inspector').innerText = document.getElementById('input-inspector').value || "NO ESPECIFICADO";

            // PAVAN 2400
            const p2400Sel = document.getElementById('prod-2400').value;
            document.getElementById('out-prod-2400').innerText = p2400Sel === 'OTRO' ? document.getElementById('custom-2400').value : p2400Sel;
            document.getElementById('out-desc-2400').innerText = document.getElementById('desc-2400').value || "Sin observaciones.";

            // PAVAN 1700
            const p1700Sel = document.getElementById('prod-1700').value;
            document.getElementById('out-prod-1700').innerText = p1700Sel === 'OTRO' ? document.getElementById('custom-1700').value : p1700Sel;
            document.getElementById('out-desc-1700').innerText = document.getElementById('desc-1700').value || "Sin observaciones.";

            // Resto de líneas
            document.getElementById('out-desc-1000').innerText = document.getElementById('desc-1000').value || "Operando normal.";
            document.getElementById('out-desc-nueva').innerText = document.getElementById('desc-nueva').value || "Operando normal.";
            document.getElementById('out-desc-madrigal').innerText = document.getElementById('desc-madrigal').value || "Operando normal.";

            document.getElementById('current-gen-time').innerText = new Date().toLocaleString();
        }

        async function downloadReport() {
            generateReport();
            const element = document.getElementById('capture-area');
            
            // Esperar un momento para asegurar que el DOM esté listo
            setTimeout(async () => {
                const canvas = await html2canvas(element, {
                    scale: 2,
                    backgroundColor: "#ffffff",
                    useCORS: true
                });
                
                const dataURL = canvas.toDataURL("image/png");
                const link = document.createElement("a");
                const t = document.getElementById('input-tanda').value;
                const f = document.getElementById('input-fecha').value;
                
                link.download = `Reporte_${t}_${f}.png`;
                link.href = dataURL;
                link.click();
            }, 100);
        }
    </script>
</body>
</html>
